<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndusTrain - Formación Industrial Práctica</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header Industrial -->
    <header class="main-header">
        <div class="header-grid">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10" stroke-width="2"/>
                        <path d="M12 6v6l4 2" stroke-width="2"/>
                    </svg>
                </div>
                <div>
                    <h1>INDUSTRAIN</h1>
                    <p class="subtitle">Sistema de Formación Industrial</p>
                </div>
            </div>
            <div class="status-panel">
                <div class="status-item">
                    <span class="status-label">EJERCICIOS</span>
                    <span class="status-value" id="total-exercises">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">COMPLETADOS</span>
                    <span class="status-value" id="completed-exercises">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">NIVEL</span>
                    <span class="status-value" id="user-level">BÁSICO</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar - Selector de Áreas -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ÁREAS FORMATIVAS</h2>
            </div>
            <nav class="area-nav" id="area-nav">
                <!-- Áreas cargadas dinámicamente -->
            </nav>
            
            <div class="sidebar-footer">
                <div class="filter-section">
                    <h3>NIVEL</h3>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-level="all">TODOS</button>
                        <button class="filter-btn" data-level="básico">BÁSICO</button>
                        <button class="filter-btn" data-level="intermedio">INTERMEDIO</button>
                        <button class="filter-btn" data-level="avanzado">AVANZADO</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Vista de Lista de Ejercicios -->
            <div class="exercise-list-view" id="exercise-list-view">
                <div class="view-header">
                    <div>
                        <h2 class="view-title" id="current-area-title">TODOS LOS EJERCICIOS</h2>
                        <p class="view-description" id="current-area-description">Situaciones industriales reales para diagnóstico y resolución</p>
                    </div>
                    <div class="exercise-count">
                        <span id="filtered-count">0</span> ejercicios
                    </div>
                </div>
                
                <div class="exercises-grid" id="exercises-grid">
                    <!-- Ejercicios cargados dinámicamente -->
                </div>
            </div>

            <!-- Vista de Ejercicio Individual -->
            <div class="exercise-detail-view" id="exercise-detail-view" style="display: none;">
                <!-- Contenido del ejercicio -->
            </div>
        </main>
    </div>

    <!-- Modal de Feedback -->
    <div class="modal-overlay" id="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header" id="modal-header">
                <!-- Estado correcto/incorrecto -->
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Explicación -->
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="modal-next-btn">SIGUIENTE EJERCICIO</button>
                <button class="btn-secondary" id="modal-close-btn">CERRAR</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/loader.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
