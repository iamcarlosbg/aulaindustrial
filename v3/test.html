<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Carga de Ejercicios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background: #2a2a2a;
        }
        .success { border-left: 4px solid #10b981; }
        .error { border-left: 4px solid #ef4444; }
        .warning { border-left: 4px solid #f59e0b; }
        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2563eb;
        }
        #results {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🔍 Test de Carga de Ejercicios</h1>
    
    <div class="status warning">
        <strong>⚠️ IMPORTANTE:</strong> Esta página debe abrirse desde un servidor web, no desde file://
        <br><br>
        <strong>Solución:</strong> Ejecuta: <code>python -m http.server 8000</code>
        <br>
        Luego abre: <a href="http://localhost:8000/test.html" style="color: #3b82f6;">http://localhost:8000/test.html</a>
    </div>

    <button onclick="testLoad()">🔄 Probar Carga de Ejercicios</button>

    <div id="results"></div>

    <script src="js/loader.js"></script>
    <script>
        async function testLoad() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="status">⏳ Cargando ejercicios...</div>';
            
            try {
                // Cargar ejercicios
                const exercises = await window.exerciseLoader.loadAllExercises();
                
                if (exercises.length > 0) {
                    results.innerHTML = `
                        <div class="status success">
                            <h2>✅ Ejercicios cargados correctamente</h2>
                            <p><strong>Total:</strong> ${exercises.length} ejercicios</p>
                            <p><strong>Por área:</strong></p>
                            <ul>
                                ${window.exerciseLoader.getAreas().map(area => 
                                    `<li>${area.name}: ${area.count} ejercicios</li>`
                                ).join('')}
                            </ul>
                            <h3>Ejemplo de ejercicio:</h3>
                            <pre style="background: #000; padding: 15px; border-radius: 8px; overflow-x: auto;">${JSON.stringify(exercises[0], null, 2)}</pre>
                        </div>
                    `;
                } else {
                    results.innerHTML = `
                        <div class="status error">
                            <h2>❌ No se cargaron ejercicios</h2>
                            <p><strong>Posibles causas:</strong></p>
                            <ul>
                                <li>Estás abriendo el archivo con file:// (usa un servidor web)</li>
                                <li>Los archivos JSON no están en la carpeta data/</li>
                                <li>Error de CORS</li>
                            </ul>
                            <p><strong>Solución:</strong></p>
                            <pre style="background: #000; padding: 10px;">python -m http.server 8000</pre>
                            <p>Luego abre: <a href="http://localhost:8000/test.html" style="color: #3b82f6;">http://localhost:8000/test.html</a></p>
                        </div>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <div class="status error">
                        <h2>❌ Error al cargar</h2>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p><strong>Tipo:</strong> ${error.name}</p>
                        <p><strong>Stack:</strong></p>
                        <pre style="background: #000; padding: 10px; overflow-x: auto;">${error.stack}</pre>
                    </div>
                `;
            }
        }

        // Auto-ejecutar al cargar
        window.addEventListener('DOMContentLoaded', () => {
            const protocol = window.location.protocol;
            if (protocol === 'file:') {
                document.getElementById('results').innerHTML = `
                    <div class="status error">
                        <h2>⚠️ Error de Protocolo</h2>
                        <p><strong>Estás usando:</strong> file://</p>
                        <p><strong>Necesitas usar:</strong> http://</p>
                        <br>
                        <p><strong>Pasos:</strong></p>
                        <ol>
                            <li>Abre terminal/cmd en esta carpeta</li>
                            <li>Ejecuta: <code>python -m http.server 8000</code></li>
                            <li>Abre en navegador: <a href="http://localhost:8000/test.html">http://localhost:8000/test.html</a></li>
                        </ol>
                    </div>
                `;
            } else {
                document.getElementById('results').innerHTML = `
                    <div class="status success">
                        <p>✅ Protocolo correcto: ${protocol}</p>
                        <p>Click en el botón para probar la carga</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
